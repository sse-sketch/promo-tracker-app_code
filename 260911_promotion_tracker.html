<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PromoDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF0EC;
    --surface:#FFFFFF;
    --surface-2:#F6F7F4;
    --ink:#232E29;
    --ink-soft:#5D6A62;
    --ink-faint:#98A69D;
    --line:#DEE4DD;
    --brand:#A15A67;
    --brand-soft:#F5E7E9;
    --urgent:#AF4A41;
    --urgent-soft:#F5E2DF;
    --warn:#B57A38;
    --warn-soft:#F3E7D4;
    --caution:#9E8A2E;
    --caution-soft:#F0EBD2;
    --calm:#4B7A62;
    --calm-soft:#E2EDE6;
    --radius:18px;
    --mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --serif:'Fraunces', 'Noto Serif KR', serif;
    --sans:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:760px;margin:0 auto;padding:44px 22px 90px;}

  /* header */
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:30px;flex-wrap:wrap;}
  .brand-eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--brand);text-transform:uppercase;margin:0 0 6px;}
  .brand-title{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-0.01em;margin:0;color:var(--ink);}
  .brand-sub{font-size:13px;color:var(--ink-soft);margin:6px 0 0;}
  .btn{
    appearance:none;border:none;cursor:pointer;font-family:var(--sans);
    font-weight:700;font-size:14px;border-radius:11px;padding:12px 20px;
    transition:transform .08s ease, background .15s ease, box-shadow .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--ink);color:#fff;box-shadow:0 8px 18px -8px rgba(35,46,41,0.45);}
  .btn-primary:hover{background:#152019;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-faint);color:var(--ink);}
  .btn-text{background:none;color:var(--ink-soft);padding:6px 8px;font-weight:600;font-size:13px;}
  .btn-text:hover{color:var(--ink);}
  .btn-topbar{padding:7px 12px;font-size:12.5px;border-radius:9px;}
  .brand-title-link{cursor:pointer;}
  .brand-title-link:hover{opacity:0.7;}
  .btn-danger-text{background:none;color:var(--urgent);padding:6px 8px;font-weight:600;font-size:13px;}
  .btn-danger-text:hover{text-decoration:underline;}
  .btn-active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .top-menu-warn-dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--urgent);
    margin-left:4px;vertical-align:top;box-shadow:0 0 0 2px var(--surface);
  }
  .history-log{max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:4px 0;background:var(--surface-2);}
  .history-entry{padding:8px 12px;font-size:12px;display:flex;flex-direction:column;gap:2px;}
  .history-entry:not(:last-child){border-bottom:1px solid var(--line);}
  .history-date{font-family:var(--mono);font-weight:700;color:var(--ink-soft);font-size:11px;}
  .history-changes{color:var(--ink);line-height:1.5;}
  .report-toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line);}
  .report-title{font-family:var(--serif);font-size:22px;font-weight:700;margin:0 0 4px;color:var(--ink);}
  .report-sub{font-size:12.5px;color:var(--ink-faint);margin:0 0 20px;}
  .report-section-title{font-size:14px;font-weight:800;color:var(--ink);margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line);}
  .report-section-title:first-of-type{border-top:none;padding-top:0;}
  .report-summary-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;}
  .report-summary-cell{border:1px solid var(--line);border-radius:10px;padding:14px 10px;text-align:center;}
  .report-summary-num{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--ink);}
  .report-summary-label{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .report-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:8px;}
  .report-table th, .report-table td{border:1px solid var(--line);padding:7px 9px;text-align:left;}
  .report-table th{background:var(--surface-2);font-weight:700;color:var(--ink-soft);}
  .report-table-detail td{font-size:12px;}
  @media print{
    body *{visibility:hidden;}
    .print-report, .print-report *{visibility:visible;}
    .print-report{position:absolute;left:0;top:0;width:100%;max-width:100%;max-height:none;box-shadow:none;border:none;padding:0;}
    .overlay{position:static;background:none;padding:0;display:block;}
    .no-print{display:none !important;}
  }
  .top-menu-dropdown{
    position:absolute;top:calc(100% + 6px);right:0;z-index:200;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 14px 30px -12px rgba(35,46,41,0.35);padding:6px;display:flex;flex-direction:column;min-width:150px;
  }
  .top-menu-dropdown button{
    appearance:none;border:none;background:none;text-align:left;cursor:pointer;
    font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);padding:9px 10px;border-radius:8px;
  }
  .top-menu-dropdown button:hover{background:var(--surface-2);}
  .search-row{margin-bottom:16px;display:flex;align-items:center;gap:10px;}
  .legend-info-icon{
    flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--surface-2);
    color:var(--ink-faint);font-size:13px;font-weight:700;font-style:italic;font-family:var(--serif);
    display:flex;align-items:center;justify-content:center;line-height:1;
    cursor:help;border:1px solid var(--line);
  }
  .legend-info-icon:hover{color:var(--ink-soft);border-color:var(--ink-faint);}
  .legend-info-wrap{position:relative;display:inline-flex;flex-shrink:0;}
  .legend-tooltip{
    display:none;flex-direction:column;gap:6px;
    position:absolute;top:calc(100% + 8px);right:0;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;box-shadow:0 14px 30px -12px rgba(35,46,41,0.35);
    font-size:12.5px;color:var(--ink-soft);white-space:nowrap;z-index:200;
    max-width:min(280px, calc(100vw - 40px));
  }
  .legend-info-wrap:hover .legend-tooltip, .legend-info-wrap:focus-within .legend-tooltip{display:flex;}
  .legend-tooltip-caption{font-size:11.5px;font-weight:700;color:var(--ink-faint);margin-bottom:2px;}
  .legend-tooltip div{display:flex;align-items:center;gap:7px;}
  .stats-row{display:grid;grid-template-columns:repeat(auto-fit, minmax(110px, 1fr));gap:10px;margin:16px 0 20px;}
  .stat-card{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:12px 18px;text-align:center;
  }
  .stat-num{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--ink);line-height:1.1;white-space:nowrap;}
  .stat-label{font-size:11px;color:var(--ink-soft);margin-top:3px;white-space:nowrap;}
  .stat-card-alert{border-color:var(--urgent);}
  .stat-card-alert .stat-num{color:var(--urgent);}
  .stat-card-clickable{cursor:pointer;}
  .stat-card-clickable:hover{border-color:#8A5A12;}
  .search-input{
    width:100%;flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:11px 14px;font-size:14px;
    font-family:var(--sans);color:var(--ink);background:var(--surface);
  }
  .search-input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand);}
  .bulk-bar{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
    background:var(--surface);border:1.5px solid var(--brand);border-radius:14px;padding:14px 18px;margin:14px 0 20px;
    box-shadow:0 8px 20px -14px rgba(35,46,41,0.3);
  }
  .bulk-count{color:var(--ink);font-size:13.5px;font-weight:700;flex-shrink:0;}
  .bulk-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .bulk-sep{width:1px;height:22px;background:var(--line);margin:0 2px;}
  .bulk-btn{
    border:none;cursor:pointer;font-family:var(--sans);font-weight:700;font-size:12.5px;
    padding:8px 14px;border-radius:999px;transition:transform .08s ease, filter .12s ease;
  }
  .bulk-btn:hover{filter:brightness(0.96);}
  .bulk-btn:active{transform:scale(0.96);}
  .bulk-btn-submitted{background:var(--calm-soft);color:var(--calm);}
  .bulk-btn-na{background:var(--surface-2);color:var(--ink-soft);}
  .bulk-btn-missed{background:var(--urgent-soft);color:var(--urgent);}
  .bulk-btn-pending{background:var(--warn-soft);color:var(--warn);}
  .bulk-btn-delete{background:var(--urgent-soft);color:var(--urgent);}
  .bulk-btn-clear{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);}
  .card-select{width:18px;height:18px;accent-color:var(--brand);cursor:pointer;flex-shrink:0;}

  /* hero */
  .hero{
    position:relative;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 22px 20px;margin:26px 0 30px;
    box-shadow:0 12px 28px -20px rgba(35,46,41,0.35);
    overflow:visible;
  }
  .hero-tag{
    position:absolute;top:-11px;left:24px;color:#fff;
    font-size:11px;font-weight:700;letter-spacing:.04em;
    padding:5px 12px;border-radius:5px;
    transform:rotate(-2deg);white-space:nowrap;
  }
  .hero-tag-next{background:var(--brand);box-shadow:0 4px 10px -4px rgba(161,90,103,0.6);}
  .hero-tag-overdue{background:var(--urgent);box-shadow:0 4px 10px -4px rgba(175,74,65,0.6);}
  .hero-next{background:var(--brand-soft);border:1.5px solid var(--brand);}
  .hero-overdue{background:var(--surface);border:1px dashed var(--urgent);box-shadow:none;}
  .hero-tag-setup{background:var(--warn-soft);color:var(--warn);box-shadow:none;transform:none;font-weight:700;}
  .hero-setup{background:var(--surface-2);border:1px dashed var(--warn);box-shadow:none;margin-top:34px;}
  .hero-tag-selection{background:#F3E7D4;color:#8A5A12;box-shadow:none;transform:none;font-weight:700;}
  .hero-selection{background:var(--surface-2);border:1px dashed #8A5A12;box-shadow:none;margin-top:34px;}
  .hero-tag-journal{background:var(--calm);box-shadow:0 4px 10px -4px rgba(75,122,98,0.6);}
  .hero-tag-starred{background:#B8860B;box-shadow:0 4px 10px -4px rgba(184,134,11,0.6);}
  .hero-pipeline{background:var(--surface-2);border:1px solid var(--line);box-shadow:0 6px 16px -14px rgba(35,46,41,0.4);}
  .hero-tag-pipeline{background:var(--ink);box-shadow:0 4px 10px -4px rgba(35,46,41,0.35);}
  .pipeline-subsection-label{font-size:12.5px;font-weight:800;margin:4px 0 12px;}
  .pipeline-subsection + .pipeline-divider + .pipeline-subsection .pipeline-subsection-label,
  .pipeline-divider + .pipeline-subsection .pipeline-subsection-label{margin-top:0;}
  .pipeline-divider{height:1px;background:var(--line);margin:20px 0;}
  .hero-starred{background:#FEF9E7;border:1.5px solid #D4A017;}
  .star-toggle{cursor:pointer;font-size:15px;flex-shrink:0;color:var(--ink-faint);line-height:1;user-select:none;}
  .star-toggle:hover{color:#D4A017;}
  .star-toggle.is-starred{color:#D4A017;}
  .hero-journal{background:var(--calm-soft);border:1.5px solid var(--calm);}
  .journal-cat-tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0;white-space:nowrap;}
  .journal-cat-todo{background:#E3ECFB;color:#2D6CDF;}
  .journal-cat-issue{background:#EFE6F9;color:#7C4FBF;}
  .journal-more-hint{padding:10px 14px;font-size:12px;color:var(--ink-soft);cursor:pointer;text-align:center;}
  .journal-count-hint{
    font-size:12.5px;color:var(--calm);background:var(--calm-soft);border:1px dashed var(--calm);
    border-radius:10px;padding:11px 16px;margin:0 0 26px;cursor:pointer;font-weight:600;
  }
  .journal-count-hint:hover{opacity:0.85;}
  .journal-linked-content{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer;}
  .journal-linked-title{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .journal-link-type-tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0;white-space:nowrap;}
  .journal-link-deadline{background:var(--brand-soft);color:var(--brand);}
  .journal-link-overdue{background:var(--surface-2);color:var(--ink-soft);}
  .journal-link-setup{background:var(--warn-soft);color:var(--warn);}
  .journal-link-selection{background:#F3E7D4;color:#8A5A12;}
  .journal-linked-progress{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink-soft);flex-shrink:0;white-space:nowrap;}
  .journal-time-badge{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--surface-2);padding:4px 7px;border-radius:6px;flex-shrink:0;}
  .journal-start-date-badge{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink-faint);background:var(--surface-2);padding:3px 7px;border-radius:6px;flex-shrink:0;white-space:nowrap;}
  .journal-more-hint:hover{color:var(--calm);}
  .selection-mini-row{cursor:default;}
  .hero-list{display:flex;flex-direction:column;gap:8px;}
  .hero-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .hero-overdue .hero-item{background:var(--surface-2);}
  .hero-item-dday{border:1.5px solid var(--urgent);background:var(--urgent-soft);box-shadow:0 0 0 1px rgba(175,74,65,0.15);}
  .hero-item-row{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;}
  .hero-item-row:hover{background:rgba(0,0,0,0.02);}
  .hero-item-title{flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hero-item-caret{font-size:10px;color:var(--ink-faint);flex-shrink:0;}
  .running-period{font-family:var(--mono);font-size:11px;color:var(--ink-faint);flex-shrink:0;}
  .status-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;flex-shrink:0;white-space:nowrap;}
  .status-badge-submitted{background:var(--calm-soft);color:var(--calm);}
  .status-badge-unjoined{background:var(--surface-2);color:var(--ink-faint);}
  .status-badge-pending{background:var(--warn-soft);color:var(--warn);}
  .channel-breakdown{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .channel-stat-table{border:1px solid var(--line);border-radius:12px;overflow-x:auto;margin-bottom:22px;background:var(--surface);scrollbar-width:none;-ms-overflow-style:none;}
  .channel-stat-table::-webkit-scrollbar{display:none;}
  .channel-stat-row{display:grid;grid-template-columns:1.4fr repeat(5, 0.8fr);gap:6px;padding:9px 14px;font-size:12.5px;align-items:center;min-width:420px;}
  .channel-stat-row:not(:last-child){border-bottom:1px solid var(--line);}
  .channel-stat-row span:not(:first-child){text-align:right;font-family:var(--mono);color:var(--ink-soft);}
  .channel-stat-head{font-weight:700;color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.03em;background:var(--surface-2);}
  .channel-stat-head span:not(:first-child){color:var(--ink-faint);}
  .channel-count-chip{font-size:13px;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer;transition:transform .08s ease;}
  .channel-count-chip:hover{transform:translateY(-1px);}
  .channel-count-chip b{font-weight:800;}
  .channel-count-chip-empty{opacity:0.55;}
  .hero-item-unjoined{opacity:0.5;}
  .section-label-action{cursor:pointer;font-weight:700;color:var(--brand);text-transform:none;letter-spacing:0;margin-left:8px;font-size:12px;}
  .section-label-action:hover{text-decoration:underline;}
  .channel-manage-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
  .channel-manage-chip{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:7px 8px 7px 14px;border-radius:999px;}
  .channel-manage-remove{cursor:pointer;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.12);
    display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
  .channel-manage-remove:hover{background:rgba(0,0,0,0.22);}
  .channel-status-toggle{cursor:pointer;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,0.14);flex-shrink:0;white-space:nowrap;}
  .channel-status-toggle:hover{background:rgba(0,0,0,0.24);}
  .channel-status-toggle-ended{background:#8A5A12;color:#fff;}
  .channel-status-toggle-ended:hover{background:#6E4710;}
  .hero-item-detail{padding:0 12px 14px 12px;}
  .hero-desc{font-size:13px;color:var(--ink-soft);margin:0 0 8px;}
  .hero-meta{font-size:13px;color:var(--ink-soft);}
  .hero-meta > div{margin-top:2px;}
  .meta-label{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;margin-right:5px;}
  .remaining-time{color:var(--urgent);font-weight:700;}
  .remaining-time-inline{font-size:11px;background:var(--urgent-soft);padding:2px 8px;border-radius:6px;flex-shrink:0;white-space:nowrap;}
  .hero-item-actions{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .dday-mini{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0;white-space:nowrap;}
  .hero-notes-toggle{font-size:12px;font-weight:700;color:var(--brand);margin-top:8px;cursor:pointer;display:inline-block;}
  .hero-notes-toggle:hover{text-decoration:underline;}
  .hero-notes{font-size:12.5px;color:var(--brand);margin-top:6px;background:var(--brand-soft);
    padding:8px 11px;border-radius:8px;line-height:1.6;}
  .hero-coupon{font-size:12.5px;color:#1F7A6C;margin-top:6px;background:#E1F2EE;
    padding:8px 11px;border-radius:8px;line-height:1.6;}

  /* filters */
  .legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin:20px 2px 14px;}
  .legend-inline{margin:2px 0 18px;}
  .legend-caption{font-size:11.5px;font-weight:700;color:var(--ink-faint);padding-right:2px;border-right:1px solid var(--line);margin-right:2px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .legend-dot.dday-urgent{background:var(--urgent);}
  .legend-dot.dday-warn{background:var(--warn);}
  .legend-dot.dday-caution{background:var(--caution);}
  .legend-dot.dday-calm{background:var(--calm);}
  .view-toggle{display:flex;align-items:center;gap:8px;margin:10px 0 16px;}
  .main-tabs{display:flex;gap:6px;margin:18px 0 14px;border-bottom:2px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;}
  .main-tabs::-webkit-scrollbar{display:none;}
  .main-tab{
    padding:10px 18px;font-size:14px;font-weight:700;color:var(--ink-faint);cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .12s ease;
    white-space:nowrap;flex-shrink:0;
  }
  .main-tab:hover{color:var(--ink-soft);}
  .main-tab.active{color:var(--ink);border-bottom-color:var(--brand);}
  .cal-header{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:12px;}
  .journal-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px;}
  .journal-date{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--ink);min-width:200px;text-align:center;}
  .journal-today-badge{font-size:11px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:2px 8px;border-radius:999px;margin-left:6px;}
  .journal-today-btn{padding:6px 12px;font-size:12px;}
  .journal-import-hint{

  .cal-cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:56px;

  .time-grid-h-wrap{position:relative;border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;background:linear-gradient(180deg,#FAFAF7,#FFFFFF);overflow-x:auto;}

<body>
<div id="app"></div>

<script>
(function(){
  const STORAGE_KEY = 'promo-tracker-items';
  const CHANNELS_KEY = 'promo-tracker-channels';
  const CHANNELS_ENDED_KEY = 'promo-tracker-channels-ended';
  const JOURNAL_KEY = 'promo-tracker-journal';
  const JOURNAL_TASKS_KEY = 'promo-tracker-journal-tasks';

  // ── 저장소 추상화 ──
  // Claude 아티팩트 안에서는 window.storage를 그대로 쓰고,
  // 아티팩트 밖(다운로드해서 로컬로 열거나 GitHub Pages 등에 올려서 접속)에서는
  // 이 파일에 window.storage가 존재하지 않으므로, 설정된 경우 GitHub 저장소(Contents API)를
  // 백엔드로 쓰고, 설정 전에는 이 브라우저의 localStorage로 자동 대체한다.
  const AppStorage = (function(){
    const GH_CONFIG_KEY = 'promoTrackerGhConfig';
    function hasNative(){ return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function'; }
    function getConfig(){
      try{ const raw = localStorage.getItem(GH_CONFIG_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
    }
    function setConfig(cfg){
      try{ localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cfg || {})); }catch(e){}
    }
    function clearConfig(){ try{ localStorage.removeItem(GH_CONFIG_KEY); }catch(e){} }
    function isGhConfigured(){ const c = getConfig(); return !!(c && c.owner && c.repo && c.token); }
    function backend(){
      if(hasNative()) return 'native';
      if(isGhConfigured()) return 'github';
      return 'local';
    }

    // ---- localStorage 폴백(설정 전 임시 저장. 브라우저/기기 하나에만 남음) ----
    const LS_NS = 'promoTrackerData::';
    function lsKey(key, shared){ return LS_NS + (shared?'shared::':'priv::') + key; }
    function localGet(key, shared){
      const raw = localStorage.getItem(lsKey(key, shared));
      return raw === null ? null : { key, value: raw, shared: !!shared };
    }
    function localSet(key, value, shared){ localStorage.setItem(lsKey(key, shared), value); return { key, value, shared: !!shared }; }
    function localDelete(key, shared){ localStorage.removeItem(lsKey(key, shared)); return { key, deleted:true, shared: !!shared }; }
    function localList(prefix, shared){
      const ns = LS_NS + (shared?'shared::':'priv::');
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf(ns) === 0){
          const bare = k.slice(ns.length);
          if(!prefix || bare.indexOf(prefix) === 0) keys.push(bare);
        }
      }
      return { keys, prefix, shared: !!shared };
    }

    // ---- GitHub Contents API 백엔드 (프라이빗 저장소에 JSON 파일로 저장) ----
    function ghFilePath(key){ return 'data/' + encodeURIComponent(key) + '.json'; }
    function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
    function b64decode(b64){ return decodeURIComponent(escape(atob(b64.replace(/\n/g,'')))); }
    async function ghApi(path, options){
      const cfg = getConfig();
      if(!cfg || !cfg.owner || !cfg.repo || !cfg.token) throw new Error('GitHub 저장소가 아직 설정되지 않았어요');
      const mergedHeaders = Object.assign({
        'Authorization': `token ${cfg.token}`,
        'Accept': 'application/vnd.github+json'
      }, (options && options.headers) || {});
      // 연달아 여러 번 저장할 때 GitHub의 "secondary rate limit"(순간적으로 요청이 몰릴 때 거는 임시 제한)에
      // 걸리면 403/429가 오는데, 이건 진짜 실패가 아니라 "잠깐 있다가 다시 해봐"라는 신호라서
      // 여기서 자동으로 대기 후 재시도함 (최대 3번) — 이게 안 되면 연타 저장이 자꾸 '저장 실패'로 보였음
      const maxAttempts = 3;
      let lastRes;
      for(let attempt = 1; attempt <= maxAttempts; attempt++){
        const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/${path}`, Object.assign({}, options || {}, { headers: mergedHeaders }));
        lastRes = res;
        const isRateLimited = res.status === 429 || (res.status === 403 && (res.headers.get('x-ratelimit-remaining') === '0' || res.headers.get('retry-after')));
        if(!isRateLimited || attempt === maxAttempts) return res;
        const retryAfterHeader = res.headers.get('retry-after');
        const waitMs = retryAfterHeader ? Math.min(parseInt(retryAfterHeader, 10) * 1000, 8000) : attempt * 1200;
        await new Promise(r => setTimeout(r, waitMs));
      }
      return lastRes;
    }
    async function ghGetFile(key){
      const cfg = getConfig();
      const branch = (cfg && cfg.branch) || 'main';
      const res = await ghApi(`contents/${ghFilePath(key)}?ref=${encodeURIComponent(branch)}`);
      if(res.status === 404) return null;
      if(!res.ok) throw new Error('GitHub 읽기 실패: ' + res.status);
      const json = await res.json();
      return { content: b64decode(json.content), sha: json.sha };
    }
    async function ghGet(key, shared){
      const fileKey = (shared?'shared__':'') + key;
      const r = await ghGetFile(fileKey);
      if(!r) return null;
      return { key, value: r.content, shared: !!shared };
    }
    // 파일 하나하나가 아니라 "레포 전체"를 하나의 큐로 세움 — GitHub Contents API는 같은 브랜치에
    // 서로 다른 파일이라도 거의 동시에 커밋하면 내부적으로 ref 갱신 경쟁이 생겨 409로 실패할 수 있어서,
    // 이 앱이 만드는 모든 write(다른 key라도)를 전역 큐 하나로 순서대로 처리해야 안전함
    let ghGlobalQueue = Promise.resolve();
    let ghLastWriteAt = 0;
    async function ghPace(){
      const minGapMs = 250;
      const wait = ghLastWriteAt + minGapMs - Date.now();
      if(wait > 0) await new Promise(r => setTimeout(r, wait));
      ghLastWriteAt = Date.now();
    }
    async function ghSetInner(key, value, shared){
      const cfg = getConfig();
      const branch = (cfg && cfg.branch) || 'main';
      const fileKey = (shared?'shared__':'') + key;
      let sha;
      try{
        const existing = await ghGetFile(fileKey);
        if(existing) sha = existing.sha;
      }catch(e){
        // 파일이 진짜 없어서(404) sha가 없는 것과, 네트워크/레이트리밋 등으로 확인 자체가 실패한 건 달라야 함.
        // 여기서 조용히 넘어가면 "이미 있는 파일"에 sha 없이 PUT을 보내서 GitHub가 409/422로 거절하고,
        // 그게 다시 '저장 실패'로 보이는 원인이 됨 — 확인 실패는 그대로 위로 던져서 재시도 로직을 태움
        throw e;
      }
      const payload = { message: `chore: update ${fileKey}`, content: b64encode(value), branch };
      if(sha) payload.sha = sha;
      const res = await ghApi(`contents/${ghFilePath(fileKey)}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      if(!res.ok) throw new Error('GitHub 저장 실패: ' + res.status);
      return { key, value, shared: !!shared };
    }
    async function ghSet(key, value, shared){
      const thisWrite = ghGlobalQueue.then(() => ghPace().then(() => ghSetInner(key, value, shared)), () => ghPace().then(() => ghSetInner(key, value, shared)));
      ghGlobalQueue = thisWrite.catch(() => {}); // 큐 자체는 실패해도 다음 저장을 막지 않게
      return thisWrite;
    }
    async function ghDeleteInner(key, shared){
      const fileKey = (shared?'shared__':'') + key;
      const existing = await ghGetFile(fileKey);
      if(!existing) return { key, deleted:true, shared: !!shared };
      const cfg = getConfig();
      const branch = (cfg && cfg.branch) || 'main';
      const res = await ghApi(`contents/${ghFilePath(fileKey)}`, { method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message:`chore: delete ${fileKey}`, sha: existing.sha, branch }) });
      if(!res.ok) throw new Error('GitHub 삭제 실패: ' + res.status);
      return { key, deleted:true, shared: !!shared };
    }
    async function ghDelete(key, shared){
      const thisWrite = ghGlobalQueue.then(() => ghPace().then(() => ghDeleteInner(key, shared)), () => ghPace().then(() => ghDeleteInner(key, shared)));
      ghGlobalQueue = thisWrite.catch(() => {});
      return thisWrite;
    }
    async function ghList(prefix, shared){
      const cfg = getConfig();
      const branch = (cfg && cfg.branch) || 'main';
      const res = await ghApi(`contents/data?ref=${encodeURIComponent(branch)}`);
      if(res.status === 404) return { keys: [], prefix, shared: !!shared };
      if(!res.ok) throw new Error('GitHub 목록 조회 실패: ' + res.status);
      const files = await res.json();
      const nsPrefix = (shared?'shared__':'') + (prefix||'');
      const keys = (Array.isArray(files) ? files : [])
        .filter(f => f.type === 'file' && f.name.endsWith('.json'))
        .map(f => decodeURIComponent(f.name.slice(0, -('.json'.length))))
        .filter(k => k.indexOf(nsPrefix) === 0)
        .map(k => shared ? k.slice('shared__'.length) : k);
      return { keys, prefix, shared: !!shared };
    }

    return {
      currentBackend: backend,
      hasNative,
      isGhConfigured,
      getConfig, setConfig, clearConfig,
      async get(key, shared){
        const b = backend();
        if(b === 'native') return window.storage.get(key, shared);
        if(b === 'github') return ghGet(key, shared);
        return localGet(key, shared);
      },
      async set(key, value, shared){
        const b = backend();
        if(b === 'native') return window.storage.set(key, value, shared);
        if(b === 'github') return ghSet(key, value, shared);
        return localSet(key, value, shared);
      },
      async delete(key, shared){
        const b = backend();
        if(b === 'native') return window.storage.delete(key, shared);
        if(b === 'github') return ghDelete(key, shared);
        return localDelete(key, shared);
      },
      async list(prefix, shared){
        const b = backend();
        if(b === 'native') return window.storage.list(prefix, shared);
        if(b === 'github') return ghList(prefix, shared);
        return localList(prefix, shared);
      }
    };
  })();

  function exportCSV(){
    const statusLabel = s => s==='submitted' ? '제출완료' : s==='na' ? '해당없음' : s==='missed' ? '미제출' : '대기중';
    const selectionLabel = it => it.status !== 'submitted' ? '' : (it.selection==='pending' ? '선정대기' : it.selection==='rejected' ? '미선정' : '선정됨');
    const headers = ['채널','제목','내용','진행기간','제출마감일','마감시각','상태','선정여부','담당자','재확인필요','쿠폰/할인율','비고','세팅유형','세팅마감일','세팅체크리스트진행률','세팅체크리스트항목'];
    function esc(v){
      const s = (v==null ? '' : String(v));
      return '"' + s.replace(/"/g, '""') + '"';
    }
    const rows = items.slice().sort((a,b) => a.deadline.localeCompare(b.deadline)).map(it => {
      const tasks = it.setupTasks || [];
      const progress = tasks.length ? `${tasks.filter(t=>t.done).length}/${tasks.length}` : '';
      const taskList = tasks.map(t => `${t.done?'[v]':'[ ]'} ${t.label}`).join('; ');
      return [
        it.channel||'', it.title||'', it.content||'', it.period||'', it.deadline||'', it.deadlineTime||'',
        statusLabel(it.status), selectionLabel(it), it.assignee||'', it.needsRecheck ? 'Y' : '', it.coupon||'', it.notes||'',
        it.setupType||'', it.setupDeadline||'', progress, taskList
      ].map(esc).join(',');
    });
    const csv = '\uFEFF' + headers.map(esc).join(',') + '\n' + rows.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `프로모션_리스트_${todayISO()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('CSV 파일이 다운로드됐어요 — 엑셀에서 열어보세요');
  }

      showToast('JSON 형식을 읽지 못했어요. 내보내기했던 텍스트 그대로 붙여넣어주세요');
      return;
    }
    let importedItems, importedJournalEntries, importedJournalTasks;
    if(Array.isArray(parsed)){
      // 예전 백업 형식(항목 배열만) — 업무일지는 이 백업에 없으므로 건드리지 않음
      importedItems = parsed;
    }else if(parsed && Array.isArray(parsed.items)){
      importedItems = parsed.items;
      importedJournalEntries = parsed.journalEntries || {};
      importedJournalTasks = parsed.journalTasks || [];
    }else{
      showToast('백업 형식을 알아볼 수 없어요. 내보내기했던 텍스트 그대로 붙여넣어주세요');
      return;
    }
    if(mode === 'replace'){
      const journalNote = importedJournalTasks !== undefined
        ? ' 업무일지 내용도 함께 덮어써요.'
        : ' (이 백업엔 업무일지 내용이 없어서 업무일지는 그대로 유지돼요.)';
      confirmModal = {
        message: `현재 ${items.length}건을 지우고 가져온 ${importedItems.length}건으로 덮어쓸까요?${journalNote}`,
        type: 'restoreReplace',
        payload: { items: importedItems, journalEntries: importedJournalEntries, journalTasks: importedJournalTasks },
        confirmLabel: '덮어쓰기'
      };
      render();
      return;
    }
    const existingIds = new Set(items.map(i => i.id));
    const toAdd = importedItems.filter(p => !existingIds.has(p.id));
    items = items.concat(toAdd);
    if(importedJournalTasks !== undefined){
      const existingTaskIds = new Set(journalTasks.map(t => t.id));
      const tasksToAdd = importedJournalTasks.filter(t => !existingTaskIds.has(t.id));
      journalTasks = journalTasks.concat(tasksToAdd);
      persistJournalTasks();
    }
    if(importedJournalEntries !== undefined){
      Object.keys(importedJournalEntries).forEach(dateKey => {
        const importedEntry = importedJournalEntries[dateKey] || { did: [] };
        if(!journalEntries[dateKey]){
          journalEntries[dateKey] = { did: (importedEntry.did || []).slice() };
        }else{
          const existingDid = new Set(journalEntries[dateKey].did || []);
          (importedEntry.did || []).forEach(line => {
            if(!existingDid.has(line)){ journalEntries[dateKey].did.push(line); existingDid.add(line); }
          });
        }
      });
      persistJournal();
    }
    persist();
    backupOpen = false;
    render();
    showToast('복원됐어요');
  }

      s = s.trim();
      let m = s.match(/^(\d{4})[-.](\d{1,2})[-.](\d{1,2})/);
      if(m) return { y:+m[1], mo:+m[2], d:+m[3] };
      m = s.match(/^(\d{1,2})\/(\d{1,2})/);
      if(m) return { y: referenceYear, mo:+m[1], d:+m[2] };
      return null;
    }
    const a = parseSide(parts[0]);
    const b = parseSide(parts[1]);
    if(!a || !b) return text.trim();
    const fmt = p => `${p.y}.${String(p.mo).padStart(2,'0')}.${String(p.d).padStart(2,'0')}`;
    return `${fmt(a)} ~ ${fmt(b)}`;
  }
  function parsePeriodDates(period){
    if(!period) return null;
    const parts = period.split('~');
    if(parts.length !== 2) return null;
    function parseSide(s){
      s = s.trim();
      const m = s.match(/^(\d{4})[.-](\d{1,2})[.-](\d{1,2})/);
      if(!m) return null;
      return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
    }
    const start = parseSide(parts[0]);
    const end = parseSide(parts[1]);
    if(!start || !end) return null;
    return { start, end: end < start ? start : end };
  }
  // 시작일 기준으로 영업일(주말 제외) N일을 거슬러 올라간 날짜를 구함 (addBusinessDays의 역방향)
  function subtractBusinessDays(startDate, days){
    const d = new Date(startDate);
    let subtracted = 0;
    while(subtracted < days){
      d.setDate(d.getDate()-1);
      const dow = d.getDay();
      if(dow !== 0 && dow !== 6) subtracted++;
    }
    return d;
  }
  // 오늘부터 targetISO까지 영업일 기준 D-day (부호 있음: 미래=양수, 과거=음수, 주말은 안 셈)
  function businessDaysUntil(targetISO){
    const today = new Date(todayISO() + 'T00:00:00');
    const target = new Date(targetISO + 'T00:00:00');
    if(target.getTime() === today.getTime()) return 0;
    const forward = target > today;
    let count = 0;
    const cursor = new Date(today);
    while(cursor.getTime() !== target.getTime()){
      cursor.setDate(cursor.getDate() + (forward ? 1 : -1));
      const dow = cursor.getDay();
      if(dow !== 0 && dow !== 6) count += forward ? 1 : -1;
    }
    return count;
  }
  const SETUP_LEAD_BUSINESS_DAYS = 5;
  // 제출완료(확정)된 프로모션의 '세팅 준비' 상태를 계산.
  // 항목에 세팅 마감일(setupDeadline)이 명시돼 있으면 그걸 기준으로, 없으면 진행 시작일(period 시작)을 기준으로 삼는다.
  // phase: 'upcoming'(아직 준비 시작 전) · 'prepping'(지금 준비해야 함) · 'live'(기준일 지남) · null(대상 아님)
  function getSetupInfo(item){
    if((item.status||'pending') !== 'submitted') return null;
    // '제출완료' ≠ 확정. 명시적으로 선정 대기중이거나 미선정이면 세팅 준비 대상이 아님.
    // (이 기능 이전에 만들어진 항목은 selection이 없는데, 하위호환을 위해 이미 선정된 것으로 간주)
    if(item.selection === 'pending' || item.selection === 'rejected') return null;
    let targetISO, targetLabel;
    if(item.setupDeadline){
      targetISO = item.setupDeadline;
      targetLabel = '세팅마감';
    }else{
      const pd = parsePeriodDates(item.period);
      if(!pd) return null;
      targetISO = pd.start;
      targetLabel = '오픈';
    }
    const setupStartISO = toISO(subtractBusinessDays(new Date(targetISO+'T00:00:00'), SETUP_LEAD_BUSINESS_DAYS));
    const daysUntilTarget = diffDays(targetISO);
    const daysUntilTargetBiz = businessDaysUntil(targetISO); // 표시용(영업일 기준) — 진행중 여부 판단 등 내부 로직은 계속 daysUntilTarget(달력 기준) 사용
    const daysUntilSetup = diffDays(setupStartISO);
    let phase;
    if(daysUntilTarget < 0) phase = 'live';
    else if(daysUntilSetup <= 0) phase = 'prepping';
    else phase = 'upcoming';
    return { targetISO, targetLabel, setupStartISO, daysUntilTarget, daysUntilTargetBiz, daysUntilSetup, phase };
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function formatNotes(s){
    if(!s) return '';
    const escaped = escapeHtml(s);
    let out = escaped
      .replace(/\n/g, '<br>')
      .replace(/([.!?])\s+(?=\S)/g, '$1<br>')
      .replace(/\)\s+(?=\S)/g, ')<br>');
    // notices with no punctuation at all still read as one dense blob — fall back to breaking on commas
    if(!/<br>/.test(out) && out.length > 60){

    return out.replace(/(<br>\s*){2,}/g, '<br>');

  function buildMorningSummary(){
    const sorted = items.filter(i => (i.status||'pending')==='pending').sort((a,b) => a.deadline.localeCompare(b.deadline));
    const due = sorted.filter(i => diffDays(i.deadline) <= 7);
    const list = due.length ? due : sorted.slice(0, 5);
    if(list.length === 0) return '오늘 기준 대기 중인 프로모션 마감이 없어요.';
    const today = todayISO();
    const lines = [`📋 프로모션 마감 알림 (${today.replace(/-/g,'.')})`, ''];
    list.forEach(i => {
      const n = diffDays(i.deadline);
      lines.push(`${ddayLabel(n)} · ${i.channel ? i.channel+' · ' : ''}${i.title || i.content} (마감 ${fmtDeadline(i)})`);

    const text = encodeURIComponent(`[마감] ${item.content}`);
    const detailLines = [];
    if(item.channel) detailLines.push(`채널: ${item.channel}`);
    if(item.period) detailLines.push(`기간: ${item.period}`);
    if(item.notes) detailLines.push(`비고: ${item.notes}`);
    detailLines.push('프로모션 다이어리에서 추가됨');

  // ── 할 일 / 이슈: 체크할 때까지 계속 남아있는 영속 태스크 + 반복(매일/매주/매월) ──
  function taskAppliesToDate(task, jd){
    if(!task.recurrence){
      if(task.createdDate && jd < task.createdDate) return false; // 지정한 날짜 되기 전엔 안 보임
      return true; // 그 날짜부터는 완료 전까지 매일 계속 보임(이월)
    }
    if(task.recurrence.until && jd > task.recurrence.until) return false; // 반복 종료일이 지나면 더 이상 안 보임
    const d = new Date(jd + 'T00:00:00');
    if(task.recurrence.type === 'daily') return d.getDay() !== 0 && d.getDay() !== 6; // 매일 = 영업일마다(주말 제외)
    if(task.recurrence.type === 'weekly') return d.getDay() === task.recurrence.dow;
    if(task.recurrence.type === 'monthly') return d.getDate() === task.recurrence.day;
    if(task.recurrence.type === 'custom') return Array.isArray(task.recurrence.days) && task.recurrence.days.includes(d.getDay());
    return false;
  }
  function isTaskDoneOnDate(task, jd){

  // 연결된 항목의 상태가 바뀌어서(예: 제출완료로 전환) 예전에 만들어둔 링크타입이 더 이상 안 맞으면 그 리마인더는 더 이상 유효하지 않음
  function isLinkedTaskStillRelevant(task){
    if(!task.linkedItemId) return true;
    const item = items.find(i => i.id === task.linkedItemId);
    if(!item) return false;
    if(task.linkedType === 'deadline' || task.linkedType === 'overdue') return (item.status||'pending') === 'pending';
    if(task.linkedType === 'setup') return isPrepping(item);
    if(task.linkedType === 'selection') return item.status === 'submitted' && item.selection === 'pending';
    return true;
  }
  function tasksForDate(jd, category){
    return journalTasks.filter(t => t.category === category && taskAppliesToDate(t, jd) && !isTaskDoneOnDate(t, jd) && isLinkedTaskStillRelevant(t));
  }
  function doneTasksForDate(jd, category){
    return journalTasks.filter(t => t.category === category && taskAppliesToDate(t, jd) && isTaskDoneOnDate(t, jd));
  }
  function wasCompletedOnDate(task, jd){
    if(!task.recurrence) return !!task.done && task.completedDate === jd;
    return !!(task.doneDates && task.doneDates[jd]);

  function recurrenceLabel(task){
    if(!task.recurrence) return '';
    const dowNames = ['일','월','화','수','목','금','토'];
    let base = '';
    if(task.recurrence.type === 'daily') base = '매일(평일)';
    else if(task.recurrence.type === 'weekly') base = `매주 ${dowNames[task.recurrence.dow]}요일`;
    else if(task.recurrence.type === 'monthly') base = `매월 ${task.recurrence.day}일`;
    else if(task.recurrence.type === 'custom'){
      const days = Array.isArray(task.recurrence.days) ? task.recurrence.days.slice().sort() : [];
      base = days.length ? `매주 ${days.map(dw => dowNames[dw]).join('·')}` : '매주 (요일 선택 필요)';
    }
    if(!base) return '';
    return task.recurrence.until ? `${base} · ~${task.recurrence.until}까지` : base;
  }
  function journalTaskRowHtml(task, jd, placeholder, accentClass){

  function isTaskUrgentToday(task){

  function taskUrgencyN(task){

  // 재사용 가능한 도움말 아이콘 — 각 기능 옆에 "?" 붙여서 사용법 안내 (지인들한테 공유해도 따로 설명 안 해도 되게)
  function infoTip(bodyHtml, width){

        ${bodyHtml}

  }
  const TIME_GRID_START_MIN = 7 * 60;   // 07:00
  const TIME_GRID_END_MIN = 22 * 60;    // 22:00
  const TIME_GRID_DEFAULT_DURATION = 30; // 종료시각 없으면 30분짜리 블록으로 표시
  function timeToMinutes(t){
    const norm = normalizeTime(t);
    if(!norm) return null;
    const m = norm.match(/^(\d{1,2}):(\d{2})/);
    if(!m) return null;
    return (+m[1]) * 60 + (+m[2]);
  }
  function packTimeGridLanes(blocks){
    // 시작시각 기준 정렬 후, 겹치지 않는 첫 레인에 배정 (구글캘린더식 컬럼 나누기)
    const sorted = blocks.slice().sort((a,b) => a.startMin - b.startMin || a.endMin - b.endMin);
    const lanes = []; // 각 레인의 마지막 종료시각
    sorted.forEach(b => {
      let laneIdx = lanes.findIndex(endMin => endMin <= b.startMin);
      if(laneIdx === -1){ laneIdx = lanes.length; lanes.push(0); }
      lanes[laneIdx] = b.endMin;
      b._lane = laneIdx;
    });
    // 서로 겹치는 그룹끼리 총 레인 수를 공유해야 폭이 맞음 — 겹침 클러스터 계산
    sorted.forEach(b => { b._laneCount = 1; });
    for(let i=0;i<sorted.length;i++){
      let maxLane = sorted[i]._lane;
      for(let j=0;j<sorted.length;j++){
        if(i===j) continue;
        const overlap = sorted[i].startMin < sorted[j].endMin && sorted[j].startMin < sorted[i].endMin;
        if(overlap) maxLane = Math.max(maxLane, sorted[j]._lane);

    }

  }
  function renderTimeGrid(jd){

    const blocks = [];

      const startMin = timeToMinutes(t.time);
      if(startMin === null) return;
      let endMin = timeToMinutes(t.endTime);
      if(endMin === null || endMin <= startMin) endMin = startMin + TIME_GRID_DEFAULT_DURATION;
      const clippedStart = Math.max(startMin, TIME_GRID_START_MIN);
      const clippedEnd = Math.min(endMin, TIME_GRID_END_MIN);
      if(clippedEnd <= TIME_GRID_START_MIN || clippedStart >= TIME_GRID_END_MIN) return; // 시간표 범위 밖
      const linkedItem = t.linkedItemId ? items.find(i => i.id === t.linkedItemId) : null;
      const label = linkedItem ? (linkedItem.title || linkedItem.content) : (t.text || '(내용 없음)');
      blocks.push({ task: t, startMin: clippedStart, endMin: Math.max(clippedEnd, clippedStart+12), label, isLinked: !!linkedItem, kind: t.category==='issue' ? 'issue' : (t.taskType||'todo') });
    });
    if(!blocks.length) return '';
    const packed = packTimeGridLanes(blocks);
    // 시간을 좌우로 흘려서(가로형) 보여줌 — 일정이 겹칠 때만 아래로 줄이 하나 더 생기고,
    // 하나뿐이면 얇은 줄 하나로 끝나서 세로 공간을 거의 안 씀. 근무시간(8~17시)만이 아니라
    // 이른 아침/저녁 업무도 있을 수 있어서 축 범위는 07:00~22:00 그대로 넓게 유지하고,
    // 좁은 화면에 억지로 욱여넣지 않게 시간당 폭을 고정해서 옆으로 스크롤해서 하루 전체를 볼 수 있게 함
    const totalMin = TIME_GRID_END_MIN - TIME_GRID_START_MIN;
    const laneCount = Math.max(...packed.map(b => b._laneCount));
    const ROW_PX = 32;
    const HOUR_PX = 64;
    const startHour = TIME_GRID_START_MIN / 60;
    const endHour = TIME_GRID_END_MIN / 60;
    const hourTicks = [];
    for(let h = startHour; h <= endHour; h++) hourTicks.push(h);
    const trackWidthPx = (endHour - startHour) * HOUR_PX;
    const ticksHtml = hourTicks.map(h => {
      const leftPx = (h - startHour) * HOUR_PX;
      const isLast = h === endHour;
      const labelStyle = isLast ? 'left:auto;right:0;text-align:right;' : 'left:2px;';
      return `<div class="time-grid-h-tick" style="left:${leftPx}px;"><span class="time-grid-h-tick-label" style="${labelStyle}">${String(h).padStart(2,'0')}:00</span></div>`;
    }).join('');
    const nowMin = (jd === todayISO()) ? (new Date().getHours()*60 + new Date().getMinutes()) : null;
    const nowLineHtml = (nowMin !== null && nowMin >= TIME_GRID_START_MIN && nowMin <= TIME_GRID_END_MIN)
      ? `<div class="time-grid-h-now" style="left:${((nowMin-TIME_GRID_START_MIN)/totalMin)*trackWidthPx}px;"><span class="time-grid-now-dot"></span></div>` : '';
    const kindIconMap = { todo:'📌', issue:'👀', meeting:'🗣️', proposal:'💡', call:'📞', review:'📋' };
    const eventsHtml = packed.map(b => {
      const leftPx = ((b.startMin - TIME_GRID_START_MIN) / totalMin) * trackWidthPx;
      const widthPx = ((b.endMin - b.startMin) / totalMin) * trackWidthPx;
      const topPx = b._lane * ROW_PX;
      const kindClass = b.isLinked ? 'time-grid-block-linked' : `time-grid-block-${b.kind}`;
      const timeLabel = `${normalizeTime(b.task.time)}${b.task.endTime ? '~'+normalizeTime(b.task.endTime) : ''}`;
      const icon = b.isLinked ? '🎯' : (kindIconMap[b.kind] || '📌');
      const durationMin = b.endMin - b.startMin;
      const compact = durationMin < 45; // 너무 좁으면 글자 대신 아이콘만 (hover로 전체 정보 확인)
      const fullTitle = `${escapeHtml(timeLabel)} ${escapeHtml(b.label)}${b.task.notes ? ' — ' + escapeHtml(b.task.notes) : ''}`;
      return `<div class="time-grid-h-block ${kindClass} ${compact?'is-compact':''}" style="left:${leftPx}px;width:${Math.max(widthPx-3,20)}px;top:${topPx}px;height:${ROW_PX-4}px;" onclick="${b.isLinked ? `App.openEdit('${b.task.linkedItemId}')` : `App.openTaskMemo('${b.task.id}')`}" title="${fullTitle}">
        ${compact ? `<span>${icon}</span>` : `<span class="time-grid-h-block-time">${icon} ${escapeHtml(timeLabel)}</span><span class="time-grid-h-block-label">${escapeHtml(b.label)}</span>`}
      </div>`;
    }).join('');
    return `
      <div class="journal-section">
        <div class="journal-section-label">🕐 오늘 시간표 ${infoTip('할일에 시작~종료 시각을 넣으면 여기에 길이대로 표시돼요. 겹치는 시간대는 아래로 줄이 하나 더 생겨요. 옆으로 스크롤하면 07:00~22:00 전체를 볼 수 있어요.', 220)}</div>
        <div class="time-grid-h-wrap">
          <div class="time-grid-h-scroll">
            <div class="time-grid-h-axis" style="width:${trackWidthPx}px;">${ticksHtml}</div>
            <div class="time-grid-h-track" style="width:${trackWidthPx}px;height:${laneCount*ROW_PX}px;">${nowLineHtml}${eventsHtml}</div>
          </div>
        </div>

  function journalTaskKindIcon(task){

  function getJournalImportCandidates(jd){
    const candidates = [];

  function resizeImageFile(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('파일을 읽지 못했어요.'));
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => reject(new Error('이미지를 열지 못했어요.'));
        img.onload = () => {
          function renderAt(maxDim, quality){
            let { width, height } = img;
            if(width > maxDim || height > maxDim){
              if(width >= height){
                height = Math.round(height * (maxDim / width));
                width = maxDim;
              }else{
                width = Math.round(width * (maxDim / height));
                height = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height); // flatten transparency so JPEG doesn't turn it black
            ctx.drawImage(img, 0, 0, width, height);
            return canvas.toDataURL('image/jpeg', quality);
          }
          function approxBytes(dataUrl){
            return Math.floor(dataUrl.split(',')[1].length * 0.75);
          }
          const targetBytes = 800 * 1024; // aim under ~800KB raw (~1.1MB base64)
          let maxDim = 1400, quality = 0.85;
          let dataUrl = renderAt(maxDim, quality);
          let tries = 0;
          while(approxBytes(dataUrl) > targetBytes && tries < 5){
            quality = Math.max(0.45, quality - 0.15);
            maxDim = Math.max(600, Math.floor(maxDim * 0.75));
            dataUrl = renderAt(maxDim, quality);
            tries++;
          }
          resolve({ base64: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function attachImageFile(file){
    if(!file || !file.type.startsWith('image/')) return;
    try{
      const resized = await resizeImageFile(file);
      modalState.pastedImages.push({ base64: resized.base64, mediaType: resized.mediaType, name: file.name || '스크린샷' });
      modalState.parseError = '';

    }catch(e){

  }
  function readFileAsBase64(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = () => reject(new Error('파일을 읽지 못했어요'));
      reader.readAsDataURL(file);
    });
  }
  // 파일 첨부(피커)용: 이미지는 기존 리사이즈 경로로, PDF는 그대로 base64 인코딩해서 첨부
  async function attachFile(file){
    if(!file) return;
    if(file.type.startsWith('image/')){
      return attachImageFile(file);
    }
    if(file.type === 'application/pdf'){
      if(file.size > 30 * 1024 * 1024){
        modalState.parseError = `"${file.name}" 파일이 너무 커요 (30MB 이하 PDF만 첨부할 수 있어요).`;
        render();
        return;
      }
      try{
        const base64 = await readFileAsBase64(file);
        modalState.pastedImages.push({ base64, mediaType: 'application/pdf', name: file.name || '첨부 PDF' });
        modalState.parseError = '';
        render();
      }catch(e){
        modalState.parseError = 'PDF를 불러오지 못했어요: ' + (e.message || '알 수 없는 오류');
        render();
      }
      return;
    }
    modalState.parseError = `"${file.name}"은(는) 지원하지 않는 형식이에요. 이미지 또는 PDF만 첨부할 수 있어요.`;
    render();
  }

  function handleTextareaPaste(e){
    const clipItems = (e.clipboardData && e.clipboardData.items) || [];
    let foundImage = false;
    for(const it of clipItems){
      if(it.type && it.type.startsWith('image/')){
        foundImage = true;
        const file = it.getAsFile();
        attachImageFile(file);
      }
    }
    if(foundImage){
      e.preventDefault();
      return;
    }
    // defend against clipboard text that's actually raw HTML source (common when copying from some admin/web tools)
    const plain = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
    if(/<[a-z!][\s\S]*>/i.test(plain)){
      e.preventDefault();
      const cleaned = plain
        .replace(/<style[\s\S]*?<\/style>/gi, ' ')
        .replace(/<script[\s\S]*?<\/script>/gi, ' ')
        .replace(/<[^>]+>/g, ' ')
        .replace(/&nbsp;/g, ' ')
        .replace(/[ \t]+/g, ' ')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
      modalState.pasteText = modalState.pasteText ? modalState.pasteText + '\n' + cleaned : cleaned;
      showToast('붙여넣은 내용에서 HTML 태그를 자동으로 걸러냈어요');
      render();
    }
  }

## kind가 "promotion"인 경우 — 채널 프로모션 제출/협의 공지 (정기 채널 공지든, MD와 개별 협의 중인 프로모션이든 모두 해당. 협의 중이라 세부사항이 아직 정해지지 않았으면 해당 필드는 비워두고 needs_recheck를 true로):

## kind가 "todo" 또는 "issue"인 경우 — 할 일, 회의/미팅/전화 등 시간 있는 일정, 이슈·특이사항 메모:

- time: 특정 시각이 언급되면 24시간제 "HH:MM"으로 (예: "오후 2시"→"14:00"). 시각 언급 없으면 빈 문자열.

구분 기준: 채널명 + 제출/마감/기간 등 프로모션 정보가 있으면 promotion. 회의/미팅/약속처럼 시간이 있는 일이면 todo(time 채움). 그냥 처리할 일이면 todo(time 빈값). 문제·우려·확인 필요 사항이면 issue.

      async function callApi(){

          })
        });
        const data = await response.json();
        return { response, data };
      }

      let response, data;
      ({ response, data } = await callApi());
      if(!response.ok && response.status >= 500){
        // transient server-side error — wait briefly and retry once
        await new Promise(r => setTimeout(r, 1500));
        ({ response, data } = await callApi());
      }
      if(!response.ok || data.type === 'error'){
        const msg = (data.error && data.error.message) || `요청 실패 (${response.status})`;
        throw new Error(msg);
      }
      const textBlock = (data.content || []).find(b => b.type === 'text');
      if(!textBlock) throw new Error('모델 응답에서 텍스트를 찾지 못했어요.');
      let raw = textBlock.text.trim();
      let clean = raw.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
      let parsed;
      try{
        parsed = JSON.parse(clean);
      }catch(parseErr){
        // model added stray prose around the JSON — pull out the array/object substring
        const start = clean.search(/[\[{]/);
        const lastArr = clean.lastIndexOf(']');
        const lastObj = clean.lastIndexOf('}');
        const end = Math.max(lastArr, lastObj);
        if(start === -1 || end === -1 || end < start){
          throw new Error('응답을 JSON으로 해석하지 못했어요: ' + clean.slice(0, 120));
        }
        parsed = JSON.parse(clean.slice(start, end + 1));
      }
      if(!Array.isArray(parsed)) parsed = [parsed];
      if(parsed.length === 0) throw new Error('추출된 항목이 없어요.');
      const promoRows = parsed.filter(p => (p.kind||'promotion') === 'promotion');
      const taskRows = parsed.filter(p => p.kind === 'todo' || p.kind === 'issue');
      if(promoRows.length === 0 && taskRows.length === 0) throw new Error('추출된 항목이 없어요.');
      modalState.reviewItems = promoRows.map(p => ({
        channel: p.channel || '',
        title: p.title || '',
        period: p.period || '',
        content: p.content || '',
        deadline: p.deadline || '',
        deadlineTime: normalizeTime(p.deadline_time || ''),
        notes: p.notes || '',
        coupon: p.coupon || '',
        needsRecheck: !!p.needs_recheck,
        status: 'pending',
        setupType: ''
      }));
      modalState.reviewTasks = taskRows.map(p => ({
        category: p.kind === 'issue' ? 'issue' : 'todo',
        text: p.text || '',
        date: p.date || today,
        time: normalizeTime(p.time || '')
      }));
      modalState.tab = 'review';
      modalState.parsing = false;
      render();
    }catch(e){
      modalState.parsing = false;
      modalState.parseError = '자동 분석에 실패했어요 (' + (e.message || '알 수 없는 오류') + '). 직접 입력 탭에서 채워주세요.';
      modalState.tab = 'manual';
      render();
    }
  }

  function saveReviewItems(){
    const rows = modalState.reviewItems || [];
    const taskRows = (modalState.reviewTasks || []).filter(t => t.text.trim());
    const missing = rows.some(r => (!r.content.trim() && !(r.title||'').trim()) || (!r.deadline && !r.needsRecheck));
    if(missing){
      modalState.parseError = '프로모션 항목에는 내용과 마감일을 채워주세요. 필요 없는 항목은 삭제하세요.';
      render();
      return;
    }
    if(rows.length === 0 && taskRows.length === 0){
      modalState.parseError = '등록할 항목이 없어요.';
      render();
      return;
    }
    const dupCount = rows.filter(r => findDuplicate(r.channel.trim(), r.title || r.content, r.deadline, null)).length;
    if(dupCount > 0){
      confirmModal = { message: `${dupCount}건이 이미 등록된 항목과 비슷해 보여요 (채널·제목·마감일 일치).\n그래도 전부 새로 등록할까요?`, type: 'reviewDup', payload: { rows, taskRows }, confirmLabel: '그래도 등록' };
      render();
      return;
    }
    doSaveReviewItems(rows);
    doSaveReviewTasks(taskRows);
    closeModal();
  }
  function doSaveReviewItems(rows){
    rows.forEach(r => {
      items.push({
        id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
        channel: r.channel.trim(),

        deadline: r.deadline,
        deadlineTime: normalizeTime((r.deadlineTime||'').trim()),
        status: r.status || 'pending',
        selection: (r.status === 'submitted') ? (r.selection || 'pending') : undefined,
        notes: (r.notes||'').trim(),
        coupon: (r.coupon||'').trim(),
        needsRecheck: !!r.needsRecheck,

  function doSaveReviewTasks(taskRows){
    taskRows.forEach(t => {

      });

  function findDuplicate(channel, titleOrContent, deadline, excludeId){
    const key = (titleOrContent||'').trim().toLowerCase();
    if(!key) return null;
    return items.find(i =>
      i.id !== excludeId &&
      (i.channel||'') === (channel||'') &&
      i.deadline === deadline &&
      (i.title||i.content||'').trim().toLowerCase() === key
    ) || null;
  }

  function normalizeSetupTasks(tasks){
    return (tasks||[])
      .map(t => ({
        id: t.id || ('t_' + Date.now() + '_' + Math.random().toString(36).slice(2,7)),
        label: (t.label||'').trim(),
        done: !!t.done
      }))
      .filter(t => t.label);
  }
  function saveForm(){
    const f = modalState.form;
    if(!f.content.trim() && !(f.title||'').trim()){
      modalState.parseError = '제목 또는 내용을 꼭 입력해주세요.';
      render();
      return;
    }
    if(!f.deadline && !f.needsRecheck){
      modalState.parseError = '제출 마감일은 꼭 입력해주세요 (아직 정해지지 않았으면 "재확인 필요"를 체크하고 비워두세요).';
      render();
      return;
    }
    if(modalState.mode === 'add'){
      const dup = findDuplicate(f.channel.trim(), f.title || f.content, f.deadline, null);
      const newFields = {
        channel: f.channel.trim(),
        title: (f.title||'').trim(),
        period: normalizePeriod(f.period.trim(), +(f.deadline||'').split('-')[0] || new Date().getFullYear()),
        content: f.content.trim(),
        deadline: f.deadline,
        deadlineTime: normalizeTime((f.deadlineTime||'').trim()),
        status: f.status || 'pending',
        selection: (f.status === 'submitted') ? (f.selection || 'pending') : undefined,
        notes: (f.notes||'').trim(),
        coupon: (f.coupon||'').trim(),
        needsRecheck: !!f.needsRecheck,
        setupTasks: normalizeSetupTasks(f.setupTasks).length ? normalizeSetupTasks(f.setupTasks) : undefined,
        setupType: resolveEffectiveSetupType(f.channel, f.setupType),
        setupDeadline: (f.setupDeadline||'').trim() || undefined,
        assignee: (f.assignee||'').trim() || undefined
      };
      if(dup){
        confirmModal = { message: `이미 비슷한 항목이 있어요: "${dup.title||dup.content}"`, type: 'formDup', payload: { dupId: dup.id, newFields }, threeWay: true };
        render();
        return;
      }
      doAddNewItem(newFields);
    }else{
      const item = items.find(i=>i.id===modalState.editId);
      if(item){
        // 변경 이력 추적 — 채널이 조건을 재협상하는 경우가 많아서, 핵심 항목이 바뀔 때마다 언제 뭐가 바뀌었는지 남겨둠
        const newPeriod = normalizePeriod(f.period.trim(), +(f.deadline||'').split('-')[0] || new Date().getFullYear());
        const newSelection = (f.status === 'submitted') ? (f.selection || 'pending') : undefined;
        const newAssignee = (f.assignee||'').trim() || undefined;
        const newSetupDeadline = (f.setupDeadline||'').trim() || undefined;
        const trackedFields = [
          ['deadline', '마감일', item.deadline, f.deadline],
          ['period', '진행기간', item.period, newPeriod],
          ['coupon', '쿠폰/할인율', item.coupon, (f.coupon||'').trim()],
          ['status', '상태', item.status||'pending', f.status||'pending'],
          ['selection', '선정여부', item.selection, newSelection],
          ['assignee', '담당자', item.assignee, newAssignee],
          ['setupDeadline', '세팅마감일', item.setupDeadline, newSetupDeadline]
        ];
        const changeNotes = [];
        trackedFields.forEach(([key, label, oldV, newV]) => {
          const oldStr = (oldV||'').toString().trim();
          const newStr = (newV||'').toString().trim();
          if(oldStr !== newStr){
            changeNotes.push(`${label}: ${oldStr||'(없음)'} → ${newStr||'(없음)'}`);
          }
        });
        if(changeNotes.length){
          if(!Array.isArray(item.history)) item.history = [];
          item.history.push({ date: todayISO(), changes: changeNotes });
        }

        item.channel = f.channel.trim();
        item.title = (f.title||'').trim();
        item.period = newPeriod;
        item.content = f.content.trim();
        item.deadline = f.deadline;
        item.deadlineTime = normalizeTime((f.deadlineTime||'').trim());
        item.status = f.status || 'pending';
        item.selection = newSelection;
        item.notes = (f.notes||'').trim();
        item.coupon = (f.coupon||'').trim();
        item.needsRecheck = !!f.needsRecheck;
        item.setupTasks = normalizeSetupTasks(f.setupTasks).length ? normalizeSetupTasks(f.setupTasks) : undefined;
        item.setupType = resolveEffectiveSetupType(f.channel, f.setupType);
        item.setupDeadline = newSetupDeadline;
        item.assignee = newAssignee;
      }
      persist();
      closeModal();
    }
  }

  function doMergeDuplicate(dupId, newFields){

  function updateSetupTaskField(idx, key, value){

  // 채널(및 채널 내 세부 유형)별 세팅 체크리스트 템플릿
  const DEFAULT_SETUP_TASKS = ['상세페이지 등록', '가격/옵션 세팅', '쿠폰·할인 등록', '재고 확인', '노출·배너 신청'];
  const CHANNEL_SETUP_TEMPLATES = {
    '에이블리': {
      subtypes: ['신규상품', '기존 프로모션'],
      '신규상품': ['상품등록','프로모션 파일 생성','제안서 파일 전달','이미지 제작 요청(썸네일/증정 등)','이미지 세팅 완료','SAP 증정 등록'],
      '기존 프로모션': ['프로모션 파일 생성','제안서 파일 전달','이미지 제작 요청(썸네일/증정 등)','이미지 세팅 완료','SAP 증정 등록']
    },
    '카카오톡딜': {
      subtypes: ['모음딜', '단품 톡딜'],
      '모음딜': ['프로모션 파일 생성','옵션리스트 생성','이미지 제작 요청(썸네일/증정/상세 이미지 등)','이미지 세팅 완료','SAP 증정 등록'],
      '단품 톡딜': ['상품별 가격 할인 등록','배송비 무료 세팅','SAP 증정 등록']
    },

      '신규상품': ['상품 등록','상품 승인 요청','가격 할인 등록','수정 승인 요청 및 시트 게시','SAP 증정 등록'],
      '기존상품': ['가격 할인 등록','수정 승인 요청 및 시트 게시','SAP 증정 등록']
    },
    '지그재그': {
      subtypes: ['신규상품', '기존 프로모션'],
      '신규상품': ['상품등록','프로모션 파일 생성','제안서 파일 전달','이미지 제작 요청(썸네일/증정 등)','이미지 세팅 완료','SAP 증정 등록','쿠폰 분담 승인'],
      '기존 프로모션': ['프로모션 파일 생성','제안서 파일 전달','이미지 제작 요청(썸네일/증정 등)','이미지 세팅 완료','SAP 증정 등록','쿠폰 분담 승인']
    },
    '컬리': {
      subtypes: null,
      default: ['상품 코드 확인','할인 리스트 업로드','등록 완료 메일 회신']
    },
    'CJ': {
      subtypes: null,
      default: ['할인가 세팅','이미지 제작 요청(썸네일/증정 등)','이미지 세팅 완료','SAP 증정 등록']
    }
  };
  // 채널에 등록된 템플릿이 없으면 공통 기본 리스트로 폴백
  function getSetupTemplateTasks(channel, setupType){
    const tpl = CHANNEL_SETUP_TEMPLATES[(channel||'').trim()];
    if(!tpl) return DEFAULT_SETUP_TASKS.slice();
    if(tpl.subtypes && tpl.subtypes.length){
      const key = (setupType && tpl.subtypes.includes(setupType)) ? setupType : tpl.subtypes[0];
      return (tpl[key] || DEFAULT_SETUP_TASKS).slice();
    }
    return (tpl.default || DEFAULT_SETUP_TASKS).slice();
  }
  // 채널에 세부 유형이 있으면 폼에 선택된 값(또는 첫번째 유형)으로 확정, 없으면 undefined
  function resolveEffectiveSetupType(channel, setupType){
    const tpl = CHANNEL_SETUP_TEMPLATES[(channel||'').trim()];
    if(tpl && tpl.subtypes && tpl.subtypes.length){
      return (setupType && tpl.subtypes.includes(setupType)) ? setupType : tpl.subtypes[0];
    }
    return undefined;
  }
  function addDefaultSetupTasks(){
    const template = getSetupTemplateTasks(modalState.form.channel, modalState.form.setupType);
    const existingLabels = new Set(modalState.form.setupTasks.map(t => (t.label||'').trim()));
    template.forEach(label => {
      if(!existingLabels.has(label)) modalState.form.setupTasks.push({id:null, label, done:false});
    });
    render();
  }
  // 채널/유형을 선택하는 순간, 전용 템플릿이 있는 채널이면서 체크리스트가 아직 비어있을 때만 자동으로 채워준다.
  // (이미 뭔가 적어놨으면 덮어쓰지 않음 — 필요하면 '채널 기본 항목 채우기' 버튼으로 수동 보완)
  function maybeAutoFillTemplateForForm(){
    if(!modalState || !modalState.form) return;
    const f = modalState.form;
    if(f.setupTasks && f.setupTasks.length) return;
    const channelKey = (f.channel||'').trim();
    if(!CHANNEL_SETUP_TEMPLATES[channelKey]) return;
    f.setupTasks = getSetupTemplateTasks(f.channel, f.setupType).map(label => ({id:null, label, done:false}));
  }
  function makeTaskObj(label){
    return { id: 't_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), label, done:false };
  }
  // 대시보드 체크판에서 모달을 열지 않고 바로 체크/해제
  function toggleItemSetupTask(itemId, taskId){
    const item = items.find(i => i.id === itemId);
    if(!item || !item.setupTasks) return;
    const task = item.setupTasks.find(t => t.id === taskId);
    if(!task) return;
    task.done = !task.done;
    persist();
    render();
  }
  // 대시보드 체크판에서 바로 항목 추가/삭제 (모달 없이)
  function addItemSetupTaskDirect(itemId, label){
    const trimmed = (label||'').trim();
    if(!trimmed) return;
    const item = items.find(i => i.id === itemId);
    if(!item) return;
    if(!item.setupTasks) item.setupTasks = [];
    item.setupTasks.push(makeTaskObj(trimmed));
    persist();
    render();
  }
  function removeItemSetupTaskDirect(itemId, taskId){
    const item = items.find(i => i.id === itemId);
    if(!item || !item.setupTasks) return;
    item.setupTasks = item.setupTasks.filter(t => t.id !== taskId);
    persist();
    render();
  }
  // '세팅 준비' 단계에 처음 진입했고 체크리스트를 아예 만든 적 없는(undefined) 항목엔
  // 기본 체크리스트를 자동으로 채워준다. 사용자가 이미 손댄 적 있는 항목([]이어도)은 건드리지 않음.
  // 이전 버전(채널 구분 없던 공통 5개 템플릿)이 그대로 남아있고 아직 하나도 체크 안 했다면
  // 데이터 손실 없이 새 채널별 템플릿으로 안전하게 교체해준다.
  function isUntouchedLegacyChecklist(tasks){
    if(!tasks || tasks.length !== DEFAULT_SETUP_TASKS.length) return false;
    if(tasks.some(t => t.done)) return false; // 하나라도 체크했으면 절대 건드리지 않음
    return DEFAULT_SETUP_TASKS.every((label, i) => tasks[i] && tasks[i].label === label);
  }
  function autoFillSetupTasksIfNeeded(){
    let changed = false;
    items.forEach(it => {
      if(!isPrepping(it)) return;
      if(it.setupTasks === undefined){
        it.setupTasks = getSetupTemplateTasks(it.channel, it.setupType).map(makeTaskObj);
        changed = true;
      }else if(CHANNEL_SETUP_TEMPLATES[(it.channel||'').trim()] && isUntouchedLegacyChecklist(it.setupTasks)){
        const correctTemplate = getSetupTemplateTasks(it.channel, it.setupType);
        const alreadyCorrect = correctTemplate.length === it.setupTasks.length && correctTemplate.every((label, i) => it.setupTasks[i].label === label);
        if(!alreadyCorrect){
          it.setupTasks = correctTemplate.map(makeTaskObj);
          changed = true;
        }
      }
    });
    if(changed) persist();
  }
  // 카드에서 수동으로 "채널 템플릿 다시 채우기" (기존 체크 진행상황은 사라지므로 확인 후 진행)
  function resetItemSetupTasksToTemplate(itemId){
    const item = items.find(i => i.id === itemId);
    if(!item) return;
    confirmModal = {
      message: `현재 체크리스트를 지우고 "${item.channel||'공통'}" 채널 템플릿으로 다시 채울까요?\n지금까지 체크한 내용은 사라져요.`,
      type: 'resetSetupTasks', payload: { itemId }, confirmLabel: '다시 채우기'
    };
    render();
  }
  function doResetItemSetupTasks(itemId){
    const item = items.find(i => i.id === itemId);
    if(!item) return;
    item.setupTasks = getSetupTemplateTasks(item.channel, item.setupType).map(makeTaskObj);
    persist();
    render();
  }
  // 제출완료(status='submitted') ≠ 확정(선정). 채널에서 실제로 골라줘야 확정이라, 별도로 '선정 여부'를 추적한다.
  // - 새로 '제출완료'로 바뀌는 순간엔 '선정 대기'로 시작 (세팅 준비 자동 시작은 '선정됨'부터)
  // - 이미 제출완료였는데 선정여부가 없던 기존 데이터(이 기능 추가 전)는 그대로 둬서 하위호환 유지
  // - 제출완료가 아닌 상태로 바뀌면 선정여부는 의미 없어지므로 비움
  function computeSelectionForStatus(prevStatus, newStatus, prevSelection){
    if(newStatus !== 'submitted') return undefined;
    if(prevStatus === 'submitted') return prevSelection; // 이미 있던 값(레거시 undefined 포함) 그대로 유지
    return 'pending';
  }
  function setItemStatus(id, status){
    const item = items.find(i=>i.id===id);
    if(!item) return;
    item.selection = computeSelectionForStatus(item.status, status, item.selection);
    item.status = status;
    if(status !== 'pending' && item.needsRecheck) item.needsRecheck = false; // 완료 처리되면 재확인 필요 플래그도 자동 해제
    persist();
    render();
  }
  function setItemSelection(id, selection){
    const item = items.find(i=>i.id===id);
    if(!item) return;
    item.selection = selection;
    persist();
    render();
  }


  function sortedFilteredItems(){
    let list = items.filter(i => !i.calendarOnly);
    if(activeFilter !== '전체'){
      list = list.filter(i => i.channel === activeFilter);
    }
    if(assigneeFilter !== '전체'){
      list = list.filter(i => (i.assignee||'') === assigneeFilter);
    }
    if(recheckOnly){
      list = list.filter(i => i.needsRecheck);
    }
    if(setupOnly){
      list = list.filter(isPrepping);
    }
    if(selectionPendingOnly){
      list = list.filter(i => i.status==='submitted' && i.selection==='pending');
    }
    if(staleOnly){
      list = list.filter(isStaleItem);
    }
    if(searchQuery.trim()){
      list = list.filter(i => matchesSearch(i, searchQuery.trim()));
    }
    list.sort((a,b) => a.deadline.localeCompare(b.deadline));
    return list;
  }
