                    <div class="journal-linked-content" onclick="${clickAction}">
                      ${linkedItem ? `<span class="journal-link-type-tag journal-link-${task.linkedType}">${journalLinkTypeLabel(task.linkedType)}</span>` : `<span class="journal-cat-tag journal-cat-${task.category}">${task.category==='issue'?'팔로우업':'할일'}</span>`}
                      ${linkedItem && linkedItem.channel ? `<span class="tag" style="background:${channelColor(linkedItem.channel).bg};color:${channelColor(linkedItem.channel).text};">${escapeHtml(linkedItem.channel)}</span>` : ''}
                      <span class="setup-mini-title">${escapeHtml(label)}</span>
                      ${ddayInfo ? `<span class="dday-mini dday-${urgencyClass(ddayInfo.n)}" title="${escapeHtml(ddayInfo.label)}">${ddayLabel(ddayInfo.n)}</span>` : ''}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // ⭐ 중요 표시 — 별표 찍은 것만(프로모션+할일). 사용자가 직접 고른 거라 자연스럽게 작게 유지되고, 개수 제한 없이 항상 다 보여줌.
    const starredItems = items.filter(i => i.starred);
    const starredTasks = journalTasks.filter(t => t.starred && !isTaskDoneOnDate(t, todayISO()) && isLinkedTaskStillRelevant(t)); // 완료됐거나 연결이 무의미해진 별표 항목은 정리
    if(starredItems.length || starredTasks.length){
      html += `
        <div class="hero hero-starred">
          <div class="hero-tag hero-tag-starred">⭐ 중요 표시 · ${starredItems.length + starredTasks.length}건</div>
          <div class="setup-mini-list">
            ${starredItems.map(item => {
              const pending = (item.status||'pending') === 'pending';
              const n = pending ? diffDays(item.deadline) : null;
              let rightBadge = '';
              if(pending && item.deadline){
                rightBadge = `<span class="dday-mini dday-${urgencyClass(n)}">${ddayLabel(n)}</span>`;
              }else if(item.status === 'submitted' && item.selection === 'pending'){
                rightBadge = `<span class="journal-link-type-tag journal-link-selection">선정확인</span>`;
              }else if(isPrepping(item)){
                const info = getSetupInfo(item);
                rightBadge = `<span class="dday-mini dday-${urgencyClass(info.daysUntilTargetBiz)}">${info.targetLabel} ${ddayLabel(info.daysUntilTargetBiz)}</span>`;
              }else{
                rightBadge = statusBadge(item);
              }
              return `
                <div class="setup-mini-card">
                  <div class="setup-mini-row" onclick="App.openEdit('${item.id}')">
                    <span class="star-toggle is-starred" onclick="event.stopPropagation();App.toggleItemStar('${item.id}')" title="중요 표시 해제">★</span>
                    ${item.channel ? `<span class="tag" style="background:${channelColor(item.channel).bg};color:${channelColor(item.channel).text};">${escapeHtml(item.channel)}</span>` : ''}
                    <span class="setup-mini-title">${escapeHtml(item.title || item.content)}</span>
                    ${rightBadge}
                  </div>
                </div>
              `;
            }).join('')}
            ${starredTasks.map(task => {
              const linkedItem = task.linkedItemId ? items.find(i => i.id === task.linkedItemId) : null;
              const ddayInfo = linkedItem ? journalLinkedDdayInfo(linkedItem, task.linkedType)
                : (task.dueDate ? { n: diffDays(task.dueDate), label: '마감' } : null);
              const label = linkedItem ? (linkedItem.title || linkedItem.content) : (task.text || '(내용 없음)');
              const clickAction = linkedItem
                ? (task.linkedType === 'setup' ? `App.openSetupPreview('${linkedItem.id}')` : `App.openEdit('${linkedItem.id}')`)
                : `App.openTaskMemo('${task.id}')`;
              return `
                <div class="setup-mini-card">
                  <div class="setup-mini-row" style="cursor:default;">
                    <span class="star-toggle is-starred" onclick="App.toggleJournalTaskStar('${task.id}')" title="중요 표시 해제">★</span>
                    <input type="checkbox" onchange="App.openTaskCheckAction('${task.id}', '${todayISO()}')" />
                    <div class="journal-linked-content" onclick="${clickAction}">
                      ${linkedItem ? `<span class="journal-link-type-tag journal-link-${task.linkedType}">${journalLinkTypeLabel(task.linkedType)}</span>` : `<span class="journal-cat-tag journal-cat-${task.category}">${task.category==='issue'?'팔로우업':'할일'}</span>`}
                      ${linkedItem && linkedItem.channel ? `<span class="tag" style="background:${channelColor(linkedItem.channel).bg};color:${channelColor(linkedItem.channel).text};">${escapeHtml(linkedItem.channel)}</span>` : ''}
                      <span class="setup-mini-title">${escapeHtml(label)}</span>
                      ${ddayInfo ? `<span class="dday-mini dday-${urgencyClass(ddayInfo.n)}" title="${escapeHtml(ddayInfo.label)}">${ddayLabel(ddayInfo.n)}</span>` : ''}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    if(!loaded){
      html += `<div class="empty">불러오는 중...</div>`;
    }else if(items.length === 0){
      html += `
        <div class="empty">
          <div class="empty-title">아직 등록된 프로모션이 없어요</div>
          <div>카톡이나 메일로 받은 공지를 붙여넣으면 자동으로 정리해드려요.</div>
          <div style="margin-top:16px;">
            <button class="btn btn-primary" onclick="App.openAdd()">+ 첫 공지 등록하기</button>
          </div>
        </div>
      `;
    }else{
      const overdueList = pendingAll.filter(i => i.deadline && diffDays(i.deadline) < 0).sort((a,b) => a.deadline.localeCompare(b.deadline));
      const worstOverdue = overdueList[0];
      const preppingItemsForBoard = items.filter(isPrepping).sort((a,b) => getSetupInfo(a).daysUntilTarget - getSetupInfo(b).daysUntilTarget);
      const selectionPendingItemsForBoard = items.filter(i => i.status==='submitted' && i.selection==='pending');

      function heroItemRow(item){
        const n = diffDays(item.deadline);
        const cls = urgencyClass(n);
        const expanded = heroExpandedIds.has(item.id);
        const isDday = item.deadline && n === 0;
        return `
          <div class="hero-item ${isDday ? 'hero-item-dday' : ''}">
            <div class="hero-item-row" onclick="if(!window.getSelection().toString()){App.toggleHeroItemExpand('${item.id}')}">
              <span class="star-toggle ${item.starred?'is-starred':''}" onclick="event.stopPropagation();App.toggleItemStar('${item.id}')" title="중요 표시">${item.starred?'★':'☆'}</span>
              <span class="dday-mini dday-${cls}">${ddayLabel(n)}</span>
              ${remainingToday(item) ? `<span class="remaining-time remaining-time-inline">⏱ ${remainingToday(item)}</span>` : ''}
              ${item.channel ? `<span class="tag" style="background:${channelColor(item.channel).bg};color:${channelColor(item.channel).text};">${escapeHtml(item.channel)}</span>` : ''}
              <span class="hero-item-title">${escapeHtml(item.title || item.content)}</span>
              <span class="hero-item-caret">${expanded ? '▲' : '▼'}</span>
            </div>
            ${expanded ? `
              <div class="hero-item-detail">
                ${item.title && item.content ? `<div class="hero-desc">${escapeHtml(item.content)}</div>` : ''}
                <div class="hero-meta">
                  ${item.period ? `<div><span class="meta-label">프로모션 기간</span> ${escapeHtml(item.period)}</div>` : ''}
                  <div><span class="meta-label">제출 마감일</span> ${fmtDeadline(item)}${remainingToday(item) ? ` · <span class="remaining-time">⏱ ${remainingToday(item)}</span>` : ''}</div>
                </div>
                ${item.coupon ? `<div class="hero-coupon">🎟️ ${formatNotes(item.coupon)}</div>` : ''}
                ${item.notes ? `<div class="hero-notes">📌 ${formatNotes(item.notes)}</div>` : ''}
                <div class="hero-item-actions">
                  ${statusSelect(item)}
                  <button class="icon-btn" title="구글 캘린더에 추가" onclick="event.stopPropagation();App.addToCalendar('${item.id}')">📅</button>
                  <button class="icon-btn" title="수정" onclick="event.stopPropagation();App.openEdit('${item.id}')">✎</button>
                  <button class="icon-btn danger" title="삭제" onclick="event.stopPropagation();App.deleteItem('${item.id}')">✕</button>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }

      const hasOverdue = !!worstOverdue;
      const hasNext = !!nearest;
      const hasSelection = selectionPendingItemsForBoard.length > 0;
      const hasSetup = preppingItemsForBoard.length > 0;

      if(!hasOverdue && !hasNext && !hasSelection && !hasSetup){
        html += `<div class="empty"><div class="empty-title">대기 중인 프로모션이 없어요</div><div>모두 제출완료 되었거나 해당없음으로 처리됐어요.</div></div>`;
      }else{
        html += `<div class="hero hero-pipeline"><div class="hero-tag hero-tag-pipeline">📂 프로모션 진행 현황</div>`;
        html += `<div class="legend legend-inline">
          <span class="legend-caption">마감 D-day 색상</span>
          <span><span class="legend-dot dday-urgent"></span>오늘·지남</span>
          <span><span class="legend-dot dday-warn"></span>3일 이내</span>
          <span><span class="legend-dot dday-caution"></span>7일 이내</span>
          <span><span class="legend-dot dday-calm"></span>여유</span>
        </div>`;

        // 1) 지난 마감(미완료) — 가장 급한 것부터
        if(hasOverdue){
          html += `
            <div class="pipeline-subsection">
              <div class="pipeline-subsection-label" style="color:var(--urgent);">⏰ 지난 마감 · 미완료 ${overdueList.length}건</div>
              <div class="hero-list">${overdueList.map(heroItemRow).join('')}</div>
            </div>
          `;
        }

        // 2) 다음 마감 (영업일 5일 이내)
        if(hasNext){
          if(hasOverdue) html += `<div class="pipeline-divider"></div>`;
          const cutoffDate = addBusinessDays(new Date(todayISO()+'T00:00:00'), 5);
          const cutoffStr = toISO(cutoffDate);
          function nextDeadlineSortKey(item){
            return item.deadline ? diffDays(item.deadline) : 0.5; // 마감일 미정인 건 오늘(D-DAY)과 D-1 사이에 끼워서 놓침 없게
          }
          let nextGroup = upcomingPending.filter(i => i.deadline <= cutoffStr).sort((a,b) => nextDeadlineSortKey(a) - nextDeadlineSortKey(b) || (a.title||a.content).localeCompare(b.title||b.content));
          if(nextGroup.length === 0) nextGroup = [nearest];
          html += `
            <div class="pipeline-subsection">
              <div class="pipeline-subsection-label" style="color:var(--brand);">📅 다음 마감 · 영업일 5일 이내 ${nextGroup.length}건</div>
              <div class="hero-list">${nextGroup.map(heroItemRow).join('')}</div>
            </div>
          `;
        }

        // 3) 선정 대기중 — 제출은 했지만 채널 확정이 안 난 것들
        if(hasSelection){
          if(hasOverdue || hasNext) html += `<div class="pipeline-divider"></div>`;
          html += `
            <div class="pipeline-subsection">
              <div class="pipeline-subsection-label" style="color:#8A5A12;">⏳ 선정 대기중 · 확인 필요 ${selectionPendingItemsForBoard.length}건</div>
              <div class="setup-mini-list">
                ${selectionPendingItemsForBoard.map(item => `
                  <div class="setup-mini-card">
                    <div class="setup-mini-row selection-mini-row">
                      <span class="star-toggle ${item.starred?'is-starred':''}" onclick="App.toggleItemStar('${item.id}')" title="중요 표시">${item.starred?'★':'☆'}</span>
                      <div class="selection-mini-clickarea" onclick="App.openEdit('${item.id}')">
                        ${item.channel ? `<span class="tag" style="background:${channelColor(item.channel).bg};color:${channelColor(item.channel).text};">${escapeHtml(item.channel)}</span>` : ''}
                        <span class="setup-mini-title">${escapeHtml(item.title || item.content)}</span>
                      </div>
                      <div class="selection-mini-controls" onclick="event.stopPropagation();">
                        ${statusSelect(item)}
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        // 4) 세팅 준비
        if(hasSetup){
          if(hasOverdue || hasNext || hasSelection) html += `<div class="pipeline-divider"></div>`;
          html += `<div class="pipeline-subsection">
            <div class="pipeline-subsection-label" style="color:var(--warn);">🛠️ 세팅 준비 · 지금 준비해야 하는 프로모션 ${preppingItemsForBoard.length}건 ${infoTip(`<b>세팅 준비란?</b><br>선정된 프로모션의 진행 시작일 기준 영업일 D-${SETUP_LEAD_BUSINESS_DAYS}부터 자동으로 뜨는 목록이에요.<br>채널마다 체크리스트(상품코드 확인, 이미지 업로드 등)가 <b>자동으로 채워져요</b> — 항목 눌러서 하나씩 체크하시면 돼요.`, 250)}</div>
            <div class="setup-mini-list">`;
          preppingItemsForBoard.forEach(item => {
            const info = getSetupInfo(item);
            const tasks = item.setupTasks || [];
            const total = tasks.length;
            const doneCount = tasks.filter(t => t.done).length;
            const dLabel = info.daysUntilTargetBiz === 0 ? 'D-DAY' : `D-${info.daysUntilTargetBiz}`;
            const isExpanded = setupMiniExpandedIds.has(item.id);
            html += `
              <div class="setup-mini-card ${isExpanded?'is-expanded':''}">
                <div class="setup-mini-row" onclick="App.toggleSetupMiniExpand('${item.id}')">
                  <span class="star-toggle ${item.starred?'is-starred':''}" onclick="event.stopPropagation();App.toggleItemStar('${item.id}')" title="중요 표시">${item.starred?'★':'☆'}</span>
                  ${item.channel ? `<span class="tag" style="background:${channelColor(item.channel).bg};color:${channelColor(item.channel).text};">${escapeHtml(item.channel)}</span>` : ''}
                  <span class="setup-mini-title">${escapeHtml(item.title || item.content)}</span>
                  <span class="setup-mini-progress">${total ? `${doneCount}/${total}` : '체크리스트 없음'}</span>
                  <span class="dday-mini" style="background:var(--warn-soft);color:var(--warn);">${dLabel}</span>
                  <span class="setup-mini-caret">${isExpanded?'▾':'▸'}</span>
                </div>
                ${isExpanded ? `
                  <div class="setup-mini-detail">
                    <div class="setup-board-tasks">
                      ${tasks.map(t => `
                        <label class="setup-task-check ${t.done?'is-done':''}">
                          <input type="checkbox" ${t.done?'checked':''} onchange="App.toggleItemSetupTask('${item.id}','${t.id}')" />
                          <span class="setup-task-label">${escapeHtml(t.label)}</span>
                          <span class="setup-task-remove" onclick="App.removeItemSetupTaskDirect('${item.id}','${t.id}')">✕</span>
                        </label>
                      `).join('')}
                    </div>
                    <div class="setup-task-add-row">
                      <input type="text" class="setup-task-add-input" placeholder="+ 항목 추가하고 Enter" onclick="event.stopPropagation();" onkeydown="if(event.key==='Enter'){event.preventDefault();App.addItemSetupTaskDirect('${item.id}', this.value); this.value='';}" />
                    </div>
                  </div>
                ` : ''}
              </div>
            `;
          });
          html += `</div></div>`;
        }

        html += `</div>`;
      }

      // 5) 이번주 진행중인 프로모션 — 참여 먼저, 미참여는 접어두고 필요할 때만 펼쳐보기
      const runningNow = items.filter(i => {
        const pd = parsePeriodDates(i.period);
        return pd && pd.start <= weekEndStr2 && pd.end >= weekStartStr && i.status !== 'na';
      }).sort((a,b) => (a.title||a.content).localeCompare(b.title||b.content));
      const runningNowJoined = runningNow.filter(i => i.status === 'submitted');
      const runningNowUnjoined = runningNow.filter(i => i.status !== 'submitted');

      function runningNowItemHtml(item){
        return `
          <div class="hero-item ${item.status !== 'submitted' ? 'hero-item-unjoined' : ''}">
            <div class="hero-item-row" onclick="if(!window.getSelection().toString()){App.openEdit('${item.id}')}">
              ${item.channel ? `<span class="tag" style="background:${channelColor(item.channel).bg};color:${channelColor(item.channel).text};">${escapeHtml(item.channel)}</span>` : ''}
              <span class="hero-item-title">${escapeHtml(item.title || item.content)}</span>
              <span class="running-period">${escapeHtml(item.period)}</span>
              ${statusBadge(item)}
            </div>
          </div>
        `;
      }

      if(runningNow.length){
        html += `<div class="section-label" style="display:flex;justify-content:space-between;align-items:center;">
          <span>🔥 이번주 진행중인 프로모션 · ${runningNow.length}건</span>
          ${runningNowUnjoined.length ? `<span class="section-label-action" style="text-transform:none;letter-spacing:normal;" onclick="App.toggleRunningNowUnjoined()">${runningNowShowUnjoined ? '▲ 미참여 접기' : `▼ 미참여 ${runningNowUnjoined.length}건 보기`}</span>` : ''}
        </div>`;
        html += `<div class="hero-list">`;
        runningNowJoined.forEach(item => { html += runningNowItemHtml(item); });
        if(runningNowShowUnjoined){
          runningNowUnjoined.forEach(item => { html += runningNowItemHtml(item); });
        }
        html += `</div>`;
      }

      // 6) 참고용 통계 — 매번 볼 필요는 없는 정보라 접어두고, 필요할 때만 펼쳐보게 함
      let statsSectionHtml = '';
      const statMonthNow = new Date();
      const statMonthPrefix = `${statMonthNow.getFullYear()}-${String(statMonthNow.getMonth()+1).padStart(2,'0')}`;
      const statMonthItems = items.filter(i => i.deadline && i.deadline.startsWith(statMonthPrefix));
      const statMonthTotal = statMonthItems.length;
      const statMonthSubmitted = statMonthItems.filter(i => i.status === 'submitted').length;
      const statMonthSelected = statMonthItems.filter(i => i.status === 'submitted' && i.selection === 'selected').length;
      const statMonthRejected = statMonthItems.filter(i => i.status === 'submitted' && i.selection === 'rejected').length;
      const participationRate = statMonthTotal ? Math.round(statMonthSubmitted / statMonthTotal * 100) : 0;
      const selectionRate = statMonthSubmitted ? Math.round(statMonthSelected / statMonthSubmitted * 100) : 0;
      statsSectionHtml += `<div class="section-label" style="margin-top:0;">📈 이번달(${statMonthNow.getMonth()+1}월) 참여율 · 선정률</div>`;
      if(statMonthTotal){
        statsSectionHtml += `
          <div class="stats-row" style="margin-bottom:22px;">
            <div class="stat-card"><div class="stat-num">${statMonthTotal}</div><div class="stat-label">이번달 마감 건수</div></div>
            <div class="stat-card"><div class="stat-num">${statMonthSubmitted}</div><div class="stat-label">제출완료</div></div>
            <div class="stat-card"><div class="stat-num">${participationRate}%</div><div class="stat-label">참여율</div></div>
            <div class="stat-card"><div class="stat-num">${statMonthSelected}</div><div class="stat-label">선정됨</div></div>
            <div class="stat-card"><div class="stat-num">${selectionRate}%</div><div class="stat-label">선정률(제출 대비)</div></div>
            <div class="stat-card"><div class="stat-num">${statMonthRejected}</div><div class="stat-label">미선정</div></div>
          </div>
        `;
        // 채널별 비교
        const statChannelMap = {};
        statMonthItems.forEach(i => {
          const c = i.channel || '(채널없음)';
          if(!statChannelMap[c]) statChannelMap[c] = { total:0, submitted:0, selected:0 };
          statChannelMap[c].total++;
          if(i.status === 'submitted'){
            statChannelMap[c].submitted++;
            if(i.selection === 'selected') statChannelMap[c].selected++;
          }
        });
        const statChannelRows = Object.entries(statChannelMap).sort((a,b) => b[1].total - a[1].total);
        if(statChannelRows.length > 1){
          statsSectionHtml += `<div class="channel-stat-table">`;
          statsSectionHtml += `<div class="channel-stat-row channel-stat-head"><span>채널</span><span>마감</span><span>제출</span><span>선정</span><span>참여율</span><span>선정률</span></div>`;
          statChannelRows.forEach(([c, d]) => {
            const pRate = d.total ? Math.round(d.submitted/d.total*100) : 0;
            const sRate = d.submitted ? Math.round(d.selected/d.submitted*100) : 0;
            statsSectionHtml += `<div class="channel-stat-row"><span>${escapeHtml(c)}</span><span>${d.total}</span><span>${d.submitted}</span><span>${d.selected}</span><span>${pRate}%</span><span>${sRate}%</span></div>`;
          });
          statsSectionHtml += `</div>`;
        }
      }else{
        statsSectionHtml += `<div class="hint" style="margin-bottom:22px;">이번달 마감인 프로모션이 아직 없어요.</div>`;
      }

      // 채널별 대기중 현황
      const channelCounts = {};
      pendingAll.forEach(i => {
        const c = i.channel || '';
        channelCounts[c] = (channelCounts[c] || 0) + 1;
      });
      const allChannelNames = Array.from(new Set([...managedChannels, ...Object.keys(channelCounts).filter(Boolean)])).filter(c => !endedChannels.includes(c));
      const channelBreakdown = allChannelNames
        .map(c => [c, channelCounts[c] || 0])
        .sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
      statsSectionHtml += `<div class="section-label">📊 채널별 대기중 현황 <span class="section-label-action" onclick="event.stopPropagation();App.openChannelManage()">⚙️ 채널 관리</span></div>`;
      if(channelBreakdown.length){
        statsSectionHtml += `<div class="channel-breakdown">`;
        channelBreakdown.forEach(([c, count]) => {
          const cc = channelColor(c);

        newSearchEl.setSelectionRange(searchCaret, searchCaret);
      }
    }
    if(journalSearchWasFocused){
      const newJournalSearchEl = document.getElementById('journalSearchInput');
      if(newJournalSearchEl){
        newJournalSearchEl.focus();
        newJournalSearchEl.setSelectionRange(journalSearchCaret, journalSearchCaret);
      }
    }
  }

  window.App = {
    openAdd: openAddModal,
    openEdit: openEditModal,
    closeModal,
    deleteItem,
    undoDelete,
    chooseConfirm,
    setFilter(c){ activeFilter = c; render(); },
    setTab(t){ modalState.tab = t; modalState.parseError=''; render(); },
    updatePaste(v){ modalState.pasteText = v; },
    updateField(k,v){ modalState.form[k] = v; },
    updateFieldAndRender(k,v){ modalState.form[k] = v; if(k==='channel') maybeAutoFillTemplateForForm(); render(); },
    updateSetupTypeAndRender(v){
      const f = modalState.form;
      const tpl = CHANNEL_SETUP_TEMPLATES[(f.channel||'').trim()];
      const tasks = f.setupTasks || [];
      const allUnchecked = tasks.every(t => !t.done);
      const currentLabels = tasks.map(t => t.label);
      const matchesSomeSubtype = tpl && tpl.subtypes && allUnchecked && tpl.subtypes.some(st => {
        const stTasks = tpl[st] || [];
        return stTasks.length === currentLabels.length && stTasks.every((l,i) => l === currentLabels[i]);
      });
      f.setupType = v;
      if(tasks.length === 0 || matchesSomeSubtype){
        // 비어있거나, 체크 하나 없이 다른 유형의 '정확한 기본 템플릿'만 있던 상태라면 안전하게 새 유형으로 교체
        f.setupTasks = getSetupTemplateTasks(f.channel, v).map(label => ({id:null, label, done:false}));
      }
      render();
    },
    handlePaste: handleTextareaPaste,
    handleFile(e){
      const files = Array.from(e.target.files || []);
      files.forEach(f => attachFile(f));
      e.target.value = '';

  loadItems();

  // 타이핑 멈추고 0.6초 뒤 저장되는 디바운스 방식이라, 그 틈에 바로 탭을 닫으면 마지막 몇 글자가 유실될 수 있음 —
  // 저장 대기 중인 디바운스 타이머가 남아있으면 닫기 전에 브라우저가 한 번 물어보게 함

    if(journalSaveDebounceTimer || journalTasksSaveDebounceTimer){
      e.preventDefault();
      e.returnValue = '';
    }
